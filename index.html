<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Digital Archaeologist</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>

    <main class="container">

        <header class="header">

            <div class="brand">
                DIGITAL ARCHAEOLOGIST
            </div>

            <p class="tagline">
                Understand what's hiding in your files.
            </p>

        </header>


        <section class="folder-section">

            <div class="section-label">
                YOUR FOLDER
            </div>

            <div class="folder-input">

                <input
                    type="text"
                    id="folderPath"
                    placeholder="Enter folder path..."
                >

                <button id="scanButton">
                    Scan →
                </button>

            </div>

            <p id="scanStatus"></p>

        </section>


        <section class="overview">

            <div class="section-label">
                OVERVIEW
            </div>


            <div class="stats">

                <div class="stat">

                    <span
                        class="stat-value"
                        id="fileCount"
                    >
                        0
                    </span>

                    <span class="stat-label">
                        Files
                    </span>

                </div>


                <div class="stat">

                    <span
                        class="stat-value"
                        id="totalStorage"
                    >
                        0 B
                    </span>

                    <span class="stat-label">
                        Storage
                    </span>

                </div>


                <div class="stat">

                    <span
                        class="stat-value"
                        id="fileTypes"
                    >
                        0
                    </span>

                    <span class="stat-label">
                        Types
                    </span>

                </div>

            </div>

        </section>

        

   <section class="findings">

    <div class="section-label">
        WHAT WE FOUND
    </div>

    <div class="finding-grid">

        <div class="finding">
            <span id="duplicateCount">0</span>
            duplicate groups
        </div>

        <div class="finding">
            <span id="emptyCount">0</span>
            empty files
        </div>

        <div class="finding">
            <span>0</span>
            old files
        </div>

        <div class="finding">
            <span id="largeFileCount">0</span>
            large files
        </div>

    </div>

</section>

<section class="duplicates">

    <div class="section-label">
        DUPLICATES
    </div>

    <div id="duplicateList"></div>

</section>


<section class="large-files">

    <div class="section-label">
        LARGE FILES
    </div>

    <div id="largeFileList"></div>

</section>
        <section class="file-types">

            <div class="section-label">
                FILE TYPES
            </div>


          <div class="type-list">

    <div class="type-row">
        <span>Images</span>
        <span id="imageCount">0</span>
    </div>

    <div class="type-row">
        <span>Videos</span>
        <span id="videoCount">0</span>
    </div>

    <div class="type-row">
        <span>Documents</span>
        <span id="documentCount">0</span>
    </div>

</div>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>
